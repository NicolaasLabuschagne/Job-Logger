name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 6 6,12,18,24,30 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Strip stray whitespace/newlines (e.g. from pasting into the secret box) and any trailing slash
          SUPABASE_URL="$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')"
          SUPABASE_URL="${SUPABASE_URL%/}"
          SUPABASE_ANON_KEY="$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')"
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY repo secret is not set."
            exit 1
          fi
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/clients?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase responded with HTTP $status"
          if [ "$status" -ge 500 ]; then
            echo "::error::Supabase returned a server error."
            exit 1
          fi
